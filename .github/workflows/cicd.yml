# Name of our pipeline
name: PHP CI/CD Pipeline

# Trigger pipeline whenever code is pushed to main
on:
  push:
    branches:
      - main

# Pipeline jobs
jobs:

  # JOB 1: BUILD
  build:
    name: Build PHP Application
    runs-on: ubuntu-latest

    steps:
      # Get source code from GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install PHP 8.3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Check PHP syntax
      - name: Validate PHP code
        run: |
          php -l index.php
          php -l src/Greeting.php

      - name: Build completed
        run: echo "Build successful!"

  # JOB 2: AUTOMATED TESTING
  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    # Test starts only if Build succeeds
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install PHP and Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      # Install project dependencies, including PHPUnit
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Execute automated test cases
      - name: Run PHPUnit
        run: vendor/bin/phpunit tests

      # Execute application
      - name: Run PHP application
        run: php index.php
